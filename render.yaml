# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
#
# Hermes Agent on Render, pre-baked with Render tools.
# https://github.com/NousResearch/hermes-agent
#
# Single web service built from the local Dockerfile.
# Modified to work on free plan (no persistent disk).
# Self-improvement data is protected by automatic GitHub backup/restore.
#
# To upgrade Hermes: bump HERMES_IMAGE in the Dockerfile and redeploy.
# To upgrade Render skills: bump RENDER_SKILLS_REF and redeploy.

services:
  - type: web
    name: hermes
    runtime: docker
    region: frankfurt
    plan: free
    # Render builds the image from this repo's Dockerfile on every deploy.
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: off
    healthCheckPath: /api/status

    # NOTE: Persistent disk removed because free plan does not support disks.
    # Self-improvement (skills + memory) is protected by the GitHub backup system
    # that was added to this repository.

    envVars:
      # Dashboard side-process
      - key: HERMES_DASHBOARD
        value: "1"
      - key: HERMES_DASHBOARD_HOST
        value: "0.0.0.0"
      - key: HERMES_DASHBOARD_PORT
        value: "10000"
      - key: HERMES_DASHBOARD_TUI
        value: "1"

      # Generated once at first deploy
      - key: HERMES_GATEWAY_TOKEN
        generateValue: true

      # Bearer token for the pre-registered Render MCP server
      - key: RENDER_MCP_API_KEY
        sync: true

      # === NEW: Required for backup/restore of self-improvement data ===
      # Add this environment variable in the Render dashboard after deploy:
      # Key:   GITHUB_BACKUP_TOKEN
      # Value: your GitHub Personal Access Token (repo scope)
